# filename: pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "createus-django-common"
version = "0.1.0"
description = "Shared Django utilities for Createus projects"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "resend>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Apple App Store Server API + Notifications V2 (createus_common.billing.providers.apple).
# Install with: pip install createus-django-common[apple]
apple = [
    "app-store-server-library>=1.6.0",
    "attrs>=23",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["createus_common*"]
